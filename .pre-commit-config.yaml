default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/tsvikas/sync-with-uv
    rev: v0.5.0
    hooks:
      - id: sync-with-uv

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  - repo: local
    hooks:
      - id: api-docs
        name: Sync docs/api.md from docstrings
        entry: python scripts/gen_api_docs.py --check
        language: python
        additional_dependencies: ["pydoc-markdown>=4.8,<5"]
        files: ^(src/django_spicy_id/.*\.py|docs/api\.md|pydoc-markdown\.yml|scripts/gen_api_docs\.py)$
        pass_filenames: false
